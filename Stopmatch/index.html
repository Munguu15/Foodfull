<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stopmatch</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="display">
      <div class="title">Stopmatch</div>
      <div class="time" id="timeDisplay">00:00:00.00</div>
      <div class="buttons">
        <button class="btn" id="startTimer">Start</button>
        <button class="btn" id="stopTimer">Stop</button>
        <button class="btn" id="resetTimer">Reset</button>
      </div>
    </div>
    <script src="main.js"></script>
  </body>
</html>
